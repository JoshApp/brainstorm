<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Delve</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
      body { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      #rotate-warning {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #000;
        color: rgba(255, 200, 140, 0.7);
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-align: center;
        padding: 0 32px;
        z-index: 1000;
      }
      /* Show on phone-sized portrait (not desktop). Game is landscape-locked. */
      @media (orientation: portrait) and (max-width: 900px) {
        #scene { display: none; }
        #rotate-warning { display: flex; }
      }

      /* When a screen with policy.hidesHud is open, hide every gameplay
         HUD element. The screen manager toggles `body.hud-hidden`. */
      body.hud-hidden #hint-overlay,
      body.hud-hidden #inventory-button,
      body.hud-hidden #depth-counter,
      body.hud-hidden #hp-bar,
      body.hud-hidden #buff-bar,
      body.hud-hidden #consumable-bar,
      body.hud-hidden #interact-button,
      body.hud-hidden #pickup-notification,
      body.hud-hidden #broadcast-stack {
        display: none !important;
      }
      /* When a screen with policy.dimsScene is open, fade the WebGL scene
         behind it so the title/end-screen reads cleanly. */
      body.scene-dimmed #scene { opacity: 0.18; transition: opacity 0.6s ease; }
      /* Restore scene opacity smoothly when no dimming screen is open. */
      #scene { transition: opacity 0.6s ease; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="rotate-warning">rotate your phone — descend in landscape</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
