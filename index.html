<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Delve</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
      /* Menus/panels declare their own vertical scroll (overflow-y: auto).
         The universal `touch-action: none` above — which stops the browser
         hijacking touches over the game (pinch-zoom, pull-to-refresh) — also
         kills touch-scrolling inside those panels on a phone. Re-enable a
         vertical pan on the scroll containers AND ALL THEIR DESCENDANTS:
         touch-action is decided by the element your finger lands on, so the
         container alone isn't enough — a drag that starts on the panel's
         content (text/rows/buttons, which inherit the universal `none`)
         would otherwise refuse to scroll. The `*` descendant rule is what
         makes dense menus (character/codex) actually pan on a phone.
         Gameplay HUD, which never sets overflow-y, keeps `none`. */
      [style*="overflow-y"] { -webkit-overflow-scrolling: touch; }
      [style*="overflow-y"],
      [style*="overflow-y"] * { touch-action: pan-y; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
      body { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      #rotate-warning {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #000;
        color: rgba(255, 200, 140, 0.7);
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-align: center;
        padding: 0 32px;
        z-index: 1000;
      }
      /* Show on phone-sized portrait (not desktop). Game is landscape-locked. */
      @media (orientation: portrait) and (max-width: 900px) {
        #scene { display: none; }
        #rotate-warning { display: flex; }
      }

      /* When a screen with policy.hidesHud is open (title, menus, death…), hide
         every gameplay HUD element. The screen manager (screen-manager.ts) toggles
         `body.hud-hidden` — so the menu manager DOES own HUD visibility.

         THE SYSTEM: give any new HUD element class="game-hud" and it's hidden
         automatically — no edit here, no leak. The id list below is legacy widgets
         not yet class-tagged; it stays as a safety net but new HUD should use the
         class. (This is why the level gauge / hearts / stamina were leaking: they
         predate the class and weren't all listed.) */
      body.hud-hidden .game-hud,
      body.hud-hidden #hint-overlay,
      body.hud-hidden #inventory-button,
      body.hud-hidden #depth-counter,
      body.hud-hidden #hp-bar,
      body.hud-hidden #health-hearts,
      body.hud-hidden #stamina-line,
      body.hud-hidden #stamina-bar,
      body.hud-hidden #buff-bar,
      body.hud-hidden #consumable-bar,
      body.hud-hidden #charge-ring,
      body.hud-hidden #interact-button,
      body.hud-hidden #interact-label,
      body.hud-hidden #directional-damage,
      body.hud-hidden #pickup-notification,
      body.hud-hidden #broadcast-stack,
      body.hud-hidden #perf-overlay,
      body.hud-hidden #boss-bar,
      body.hud-hidden #boss-intro-card,
      body.hud-hidden #xp-bar-hud,
      body.hud-hidden #xp-sigil,
      body.hud-hidden #vignette-lowhp,
      body.hud-hidden #vignette-persistent,
      body.hud-hidden #gold-hud {
        display: none !important;
      }

      /* HUD-only inspection mode — hide the 3D canvas and put a flat
         backdrop behind the rest. Lets us snap HUD widgets cleanly
         (inventory panel, hp bar, hotbar, broadcast pop, boss bar)
         without the dungeon scene fighting them. */
      body.hud-only {
        background: #2a2a30;
      }
      body.hud-only #scene { display: none !important; }
      /* Also strip the perf overlay in hud-only — it's still noise. */
      body.hud-only #perf-overlay { display: none !important; }
      /* When a screen with policy.dimsScene is open, fade the WebGL scene
         behind it so the title/end-screen reads cleanly. */
      body.scene-dimmed #scene { opacity: 0.18; transition: opacity 0.6s ease; }
      /* Restore scene opacity smoothly when no dimming screen is open. */
      #scene { transition: opacity 0.6s ease; }

      /* Boot loading veil — painted by the HTML itself so it covers the very
         first frame, before any module JS runs. main.ts holds it up while the
         scene builds AND while a pending PWA update applies (a reload behind
         the veil), then fades it out to reveal the title. So the player never
         sees the stale menu flash then reload — they wait here, then land on
         the fresh build. */
      #boot-loading {
        position: fixed; inset: 0; z-index: 2000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: #000;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.45s ease;
      }
      #boot-loading.boot-hide { opacity: 0; pointer-events: none; }
      #boot-loading .boot-mark {
        color: rgba(224, 214, 196, 0.82);
        font-size: 30px; font-weight: 600;
        letter-spacing: 0.55em; text-indent: 0.55em;
      }
      #boot-loading .boot-sub {
        color: rgba(255, 150, 80, 0.55);
        font-size: 11px; letter-spacing: 0.42em; text-indent: 0.42em;
        text-transform: uppercase;
        animation: boot-pulse 1.5s ease-in-out infinite;
      }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.22; } 50% { opacity: 0.85; } }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="rotate-warning">rotate your phone — descend in landscape</div>
    <div id="boot-loading">
      <div class="boot-mark">DELVE</div>
      <div class="boot-sub">descending</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
