<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Delve</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-user-select: none; user-select: none; }
      /* Menus/panels declare their own vertical scroll (overflow-y: auto).
         The universal `touch-action: none` above — which stops the browser
         hijacking touches over the game (pinch-zoom, pull-to-refresh) — also
         kills touch-scrolling inside those panels on a phone. Re-enable a
         vertical pan on the scroll containers AND ALL THEIR DESCENDANTS:
         touch-action is decided by the element your finger lands on, so the
         container alone isn't enough — a drag that starts on the panel's
         content (text/rows/buttons, which inherit the universal `none`)
         would otherwise refuse to scroll. The `*` descendant rule is what
         makes dense menus (character/codex) actually pan on a phone.
         Gameplay HUD, which never sets overflow-y, keeps `none`. */
      [style*="overflow-y"] { -webkit-overflow-scrolling: touch; }
      [style*="overflow-y"],
      [style*="overflow-y"] * { touch-action: pan-y; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
      body { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      #rotate-warning {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #000;
        color: rgba(255, 200, 140, 0.7);
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-align: center;
        padding: 0 32px;
        z-index: 1000;
      }
      /* Show on phone-sized portrait (not desktop). Game is landscape-locked. */
      @media (orientation: portrait) and (max-width: 900px) {
        #scene { display: none; }
        #rotate-warning { display: flex; }
      }

      /* When a screen with policy.hidesHud is open (title, menus, death…), hide
         every gameplay HUD element. The screen manager (screen-manager.ts) toggles
         `body.hud-hidden`, so the menu manager OWNS HUD visibility — ONE mechanism.

         THE SYSTEM: every HUD element carries class="game-hud" (added where it's
         created). A new HUD widget just adds the class and is hidden automatically —
         no id list to maintain, no leak. (The old per-id list was incomplete, which
         is why the level gauge / hearts / stamina leaked onto the menu.) */
      body.hud-hidden .game-hud {
        display: none !important;
      }
      /* Same rule during the boot veil (body.booting — set in the HTML, cleared by
         hideBootLoading) and level transitions (body.descending — owned by
         descent-fade). The HUD used to bleed OVER the covers (inventory button
         z=95, LUX z=9998 vs cover z=50) — covers now own HUD visibility the same
         way screens do, instead of joining a z-index war. */
      body.booting .game-hud,
      body.descending .game-hud {
        display: none !important;
      }

      /* HUD-only inspection mode — hide the 3D canvas and put a flat
         backdrop behind the rest. Lets us snap HUD widgets cleanly
         (inventory panel, hp bar, hotbar, broadcast pop, boss bar)
         without the dungeon scene fighting them. */
      body.hud-only {
        background: #2a2a30;
      }
      body.hud-only #scene { display: none !important; }
      /* Also strip the perf overlay in hud-only — it's still noise. */
      body.hud-only #perf-overlay { display: none !important; }
      /* When a screen with policy.dimsScene is open, fade the WebGL scene
         behind it so the title/end-screen reads cleanly. */
      body.scene-dimmed #scene { opacity: 0.18; transition: opacity 0.6s ease; }
      /* Restore scene opacity smoothly when no dimming screen is open. */
      #scene { transition: opacity 0.6s ease; }

      /* Boot loading veil — painted by the HTML itself so it covers the very
         first frame, before any module JS runs. main.ts holds it up while the
         scene builds AND while a pending PWA update applies (a reload behind
         the veil), then fades it out to reveal the title. So the player never
         sees the stale menu flash then reload — they wait here, then land on
         the fresh build. */
      #boot-loading {
        position: fixed; inset: 0; z-index: 2000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px;
        /* Not flat black: a faint warm breath in the centre falling to true black
           at the edges — the dark has depth before it has geometry. */
        background:
          radial-gradient(ellipse 90% 70% at 50% 46%, rgba(38, 22, 12, 0.55), rgba(0,0,0,0) 60%),
          #000;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.45s ease;
      }
      /* The ember — a single coal breathing in the dark above the wordmark. */
      #boot-loading .boot-ember {
        width: 7px; height: 7px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,196,120,0.95) 0%, rgba(255,120,40,0.75) 45%, rgba(120,30,8,0) 75%);
        box-shadow: 0 0 18px 6px rgba(255,130,50,0.28), 0 0 48px 18px rgba(255,110,40,0.10);
        animation: ember-breathe 2.6s ease-in-out infinite;
        margin-bottom: 6px;
      }
      @keyframes ember-breathe {
        0%, 100% { transform: scale(0.85); opacity: 0.55; }
        55%      { transform: scale(1.15); opacity: 1; }
      }
      /* Reusable coal — the descent cover (descent-fade.ts) breathes the same ember. */
      .ember-coal {
        width: 7px; height: 7px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,196,120,0.95) 0%, rgba(255,120,40,0.75) 45%, rgba(120,30,8,0) 75%);
        box-shadow: 0 0 18px 6px rgba(255,130,50,0.28), 0 0 48px 18px rgba(255,110,40,0.10);
        animation: ember-breathe 2.6s ease-in-out infinite;
      }
      #boot-loading.boot-hide { opacity: 0; pointer-events: none; }
      #boot-loading .boot-mark {
        color: rgba(224, 214, 196, 0.82);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 30px; font-weight: 600;
        letter-spacing: 0.55em; text-indent: 0.55em;
        text-shadow: 0 0 24px rgba(255, 140, 60, 0.12);
      }
      #boot-loading .boot-sub {
        color: rgba(255, 150, 80, 0.55);
        font-size: 11px; letter-spacing: 0.42em; text-indent: 0.42em;
        text-transform: uppercase;
        animation: boot-pulse 1.5s ease-in-out infinite;
      }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.22; } 50% { opacity: 0.85; } }
      /* Boot progress bar — driven by ui/boot-progress.ts across ALL FOUR boot
         phases (see that file for why it used to cover only one of them). Visible
         from first paint at zero: the boot is never instant, so there is nothing
         to protect against flashing, and a bar that appears late is a bar the
         player catches already part-filled. */
      #boot-loading .boot-bar {
        width: min(220px, 50vw); height: 2px; margin-top: 4px;
        background: rgba(255, 150, 80, 0.1); overflow: hidden;
        opacity: 0; transition: opacity 0.4s ease;
      }
      #boot-loading .boot-bar.on { opacity: 1; }
      #boot-loading .boot-bar-fill {
        height: 100%; width: 100%;
        transform: scaleX(0); transform-origin: left center;
        background: linear-gradient(90deg, rgba(255, 150, 80, 0.25), rgba(255, 150, 80, 0.8));
        transition: transform 0.25s ease-out;
      }
    </style>
    <script>
      // ── Stale-shell self-heal ───────────────────────────────────────────────
      // PWA hazard: the service worker caches index.html, but a deploy replaces the
      // HASHED js/css chunks it points at. The cached shell then requests chunk hashes
      // that 404 → the app never boots → blank screen until a manual HARD REFRESH
      // (which bypasses the SW). This does that hard refresh automatically: on a failed
      // chunk load — or if the entry never boots within a budget — drop the SW + caches
      // and reload to fetch the fresh build. A once-per-session guard prevents a reload
      // loop when the failure is something else (a genuine network outage). Runs in
      // <head>, BEFORE the entry module, so its error listener is armed in time.
      (function () {
        var HEAL = 'delve:self-heal', firing = false;
        function selfHeal(reason) {
          if (firing) return; firing = true;
          if (sessionStorage.getItem(HEAL)) return;   // already healed this session — surface the real error
          sessionStorage.setItem(HEAL, reason || '1');
          var done = false, go = function () { if (!done) { done = true; location.reload(); } };
          try {
            var jobs = [];
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations()
              .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys()
              .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            Promise.all(jobs).then(go, go);
            setTimeout(go, 2000);   // never hang on cleanup
          } catch (e) { go(); }
        }
        // A hashed chunk / stylesheet 404'd from a stale shell.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) selfHeal('asset');
        }, true);
        // A lazily-imported chunk failed mid-session (Vite's signal).
        window.addEventListener('vite:preloadError', function () { selfHeal('preload'); });
        // Backstop: the entry module never executed within the budget (set __delveBooted).
        window.__delveBooted = false;
        setTimeout(function () { if (!window.__delveBooted) selfHeal('timeout'); }, 10000);
        // A clean boot clears the guard so a FUTURE real stale-shell can heal again.
        window.addEventListener('delve:booted', function () { sessionStorage.removeItem(HEAL); });
      })();
    </script>
  </head>
  <body class="booting">
    <canvas id="scene"></canvas>
    <div id="rotate-warning">rotate your phone — descend in landscape</div>
    <div id="boot-loading">
      <div class="boot-ember"></div>
      <div class="boot-mark">DELVE</div>
      <div class="boot-sub">descending</div>
      <!-- `on` from first paint: JS module evaluation is ~2s of real boot time that
           the player used to spend looking at a veil with no bar on it. The bar is
           part of the veil, not a thing that appears later. -->
      <div class="boot-bar on"><div class="boot-bar-fill"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
