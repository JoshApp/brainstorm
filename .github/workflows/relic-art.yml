# Generate relic 2.5D art on GitHub's runners (open network → fal.run reachable,
# unlike the sandboxed dev container). Manually dispatched. Generates via Flux,
# bakes the sprites, and pushes the results to the `relic-art` branch so they can
# be reviewed in a PR (webp renders in the GitHub diff) before merging to main.
#
# Needs one repo SECRET: FAL_KEY = <id>:<secret> from fal.ai.
# Trigger: Actions tab → "relic art" → Run workflow, or via the API.

name: relic art

on:
  # Two ways to fire: the Actions-tab button (workflow_dispatch), OR a push that
  # touches `.art-request` (so a session that can push but can't dispatch drives
  # it — write the params into that file and push). Params come from inputs on
  # dispatch, or from the KEY=VALUE lines of .art-request on push.
  workflow_dispatch:
    inputs:
      relics:
        description: 'Which relics: "all", or space-separated ids (e.g. "gorged-tick bone-amulet")'
        default: 'all'
        type: string
      candidates:
        description: 'Candidates per relic (1 = auto-ship; >1 = explore, review runs, promote by hand)'
        default: '1'
        type: string
      promote_and_bake:
        description: 'Auto-promote the newest run per relic and bake sprites (off = generate only, for hand-curation)'
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '.art-request'

permissions:
  contents: write

concurrency:
  group: relic-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # bake-relics.ts renders the sprite in a headless Chromium (canvas keying);
      # the runner has none until this installs it.
      - run: npx playwright install --with-deps chromium

      # 0. Resolve params from EITHER the dispatch inputs OR the .art-request file
      #    (KEY=VALUE lines: relics=, candidates=, promote_and_bake=). Defaults:
      #    all relics, 1 candidate, promote+bake on.
      - name: Resolve params
        id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            relics="${{ inputs.relics }}"; candidates="${{ inputs.candidates }}"; bake="${{ inputs.promote_and_bake }}"; styles=""
          else
            relics="$(sed -n 's/^relics=//p' .art-request | head -1)"
            candidates="$(sed -n 's/^candidates=//p' .art-request | head -1)"
            bake="$(sed -n 's/^promote_and_bake=//p' .art-request | head -1)"
            styles="$(sed -n 's/^styles=//p' .art-request | head -1)"
          fi
          echo "relics=${relics:-all}"           >> "$GITHUB_OUTPUT"
          echo "candidates=${candidates:-1}"      >> "$GITHUB_OUTPUT"
          echo "bake=${bake:-true}"               >> "$GITHUB_OUTPUT"
          echo "styles=${styles}"                 >> "$GITHUB_OUTPUT"
          echo "Resolved: relics='${relics:-all}' candidates='${candidates:-1}' bake='${bake:-true}' styles='${styles}'"

      # 0b. BAKE mode: seed the working tree with the already-baked sprites +
      #     index from the relic-art branch, so a TARGETED re-roll (relics=<a
      #     few>) overwrites only those and keeps the rest of the set. Harmless
      #     for relics=all (every sprite is re-baked anyway).
      - name: Seed existing sprites (bake mode)
        if: ${{ steps.p.outputs.styles == '' }}
        run: |
          git fetch origin relic-art || true
          git checkout origin/relic-art -- public/relics src/content/relic-art-index.ts 2>/dev/null \
            && echo "seeded from relic-art branch" || echo "no relic-art branch yet — baking fresh"

      # 1. Generate through Flux (fal.ai). Runs are written under public/art/runs
      #    (gitignored — kept only as a build artifact for review below).
      #    STYLE-SWEEP mode: if `styles` is set, generate the relics once per
      #    register (ink / specimen / oil / relief / …) so we can compare art
      #    directions. Otherwise a single default-register run.
      - name: Generate
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          if [ -n "${{ steps.p.outputs.styles }}" ]; then
            for s in ${{ steps.p.outputs.styles }}; do
              echo "── style: $s ──"
              npx tsx scripts/art.ts relic ${{ steps.p.outputs.relics }} --style "$s" --n ${{ steps.p.outputs.candidates }}
            done
          else
            npx tsx scripts/art.ts relic ${{ steps.p.outputs.relics }} --n ${{ steps.p.outputs.candidates }}
          fi

      # 1b. STYLE-SWEEP: compose a relics × styles comparison contact sheet for
      #     review (one PNG picks the direction). No bake in this mode.
      - name: Relic style contact sheet
        if: ${{ steps.p.outputs.styles != '' }}
        run: |
          npx tsx scripts/art-relic-contact.ts "public/art/relic-styles.png" "${{ steps.p.outputs.styles }}" "${{ steps.p.outputs.relics }}"

      # 2. Promote newest-per-relic + bake to public/relics/*.webp + regen index.
      #    Skipped in style-sweep mode (that's exploration, not a ship).
      - name: Promote + bake
        if: ${{ steps.p.outputs.bake == 'true' && steps.p.outputs.styles == '' }}
        run: |
          npx tsx scripts/art-promote-relics.ts ${{ steps.p.outputs.relics }}
          npx tsx scripts/bake-relics.ts

      # 3. Upload every raw run PNG so a human can eyeball quality / pick winners.
      - name: Upload runs for review
        uses: actions/upload-artifact@v4
        with:
          name: relic-runs
          path: public/art/runs/*.png
          if-no-files-found: warn
          retention-days: 14

      # 4a. STYLE-SWEEP: push the comparison contact sheet + raw runs + manifest
      #     to the `relic-style-test` branch so the direction can be picked from
      #     the diff (the PNG renders in GitHub). No bake, no ship.
      - name: Commit style sheet to relic-style-test branch
        if: ${{ steps.p.outputs.styles != '' }}
        run: |
          git config user.name  "delve-art-bot"
          git config user.email "actions@github.com"
          git add -f public/art/relic-styles.png public/art/runs
          if git diff --cached --quiet; then
            echo "No style-sweep output to commit."
            exit 0
          fi
          git checkout -B relic-style-test
          git commit \
            -m "Relic art STYLE SWEEP — compare registers (Flux)" \
            -m "relic-styles.png is a relics × registers grid: ${{ steps.p.outputs.styles }}. Pick a direction, then bake the winner for all 56."
          git push --force-with-lease origin relic-style-test

      # 4b. Push the baked sprites + index to the `relic-art` branch for a PR.
      - name: Commit sprites to relic-art branch
        if: ${{ steps.p.outputs.bake == 'true' && steps.p.outputs.styles == '' }}
        run: |
          git config user.name  "delve-art-bot"
          git config user.email "actions@github.com"
          git add -f public/relics src/content/relic-art-index.ts
          if git diff --cached --quiet; then
            echo "No sprite changes to commit."
            exit 0
          fi
          git checkout -B relic-art
          git commit \
            -m "Bake relic 2.5D sprites (Flux)" \
            -m "Generated via the relic-art workflow. Review the sprites in the diff, then merge to main to ship them into the reliquary + drops." \
            -m "Patch-area: content"
          git push --force-with-lease origin relic-art
