name: Deploy to GitHub Pages

# Deploys ONLY from `main`. Session branches (claude/<task-name>) are
# work branches — agents push there freely without racing on the live
# URL. Going live = merging the session branch into main, which is what
# `npm run live` does in one step. Keep this file in sync with the
# README + the `Deploy` section of CLAUDE.md.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the patch-log generator (prebuild) can read
          # every commit. Default shallow clone (depth 1) would yield a
          # one-entry changelog.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The suite used to run only in the local pre-push hook, which
      # SKIP_PREPUSH=1 bypasses and a cloud session may not have. A red test
      # now stops the deploy instead of reaching the phone.
      #
      # Only the tests this push can reach (scripts/test-impact.ts walks the
      # import graph; anything it can't account for runs everything). The full
      # suite is ~15 CPU-minutes — ~73s on a 32-core desktop, ~5 min on a 4-core
      # runner — and would turn the ~90s deploy loop into a six-minute one.
      # No usable `before` (manual dispatch, first push, force-push) → full run.
      - name: Test (what this push can reach)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            npm test -- --affected --since="$BEFORE"
          else
            npm test
          fi
      - run: npm run build
        # Sentry source-map upload activates only when all three are set as repo
        # secrets/vars (Settings → Secrets and variables → Actions). Until then
        # the vite plugin is inert and the build is unchanged.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          # Clerk publishable key for prod (account-link). Public by design;
          # set repo var CLERK_PUBLISHABLE_KEY to the pk_live key to go
          # production. Absent → the code falls back to the dev pk_test key.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          # Feedback collector (bug reports → a Supabase REST table). Inert until
          # BOTH are set: VITE_REPORT_ENDPOINT as a repo VAR (the public
          # /rest/v1/reports URL) and VITE_REPORT_KEY as a repo SECRET (the anon
          # key — safe to embed since the table's RLS allows INSERT only). Setup
          # SQL + the puller are in scripts/reports.ts. Absent → reports fall back
          # to the share sheet / download, exactly as today.
          VITE_REPORT_ENDPOINT: ${{ vars.REPORT_ENDPOINT }}
          VITE_REPORT_KEY: ${{ secrets.REPORT_KEY }}
      # Reads dist/ and fails on anything that must never ship: source maps,
      # and strings that only exist inside DEV-gated debug code (a missing gate).
      - run: npm run release-check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Build-in-public devlog: post new Patch-summary entries to Discord.
      # No-op unless DISCORD_PATCHLOG_WEBHOOK secret is set (the webhook URL is a
      # secret). Never fails the deploy — the site is already uploaded above.
      - run: npm run post-discord
        continue-on-error: true
        env:
          DISCORD_PATCHLOG_WEBHOOK: ${{ secrets.DISCORD_PATCHLOG_WEBHOOK }}
          PATCH_BEFORE: ${{ github.event.before }}
          PATCH_AFTER: ${{ github.sha }}

  # Boots a real floor on BOTH graphics backends in headless Chrome
  # (scripts/backend-boot.ts): WebGL2 is the path for Steam Deck, Exynos phones,
  # iPhones before iOS 26 and any refused adapter, and nothing else exercises
  # it. Runs beside build, NOT in deploy's `needs` — a new headless-GPU job has
  # to prove it doesn't flake before it is allowed to stop a deploy. A red X
  # here still means look. (docs/OPEN-ITEMS.md: promote to blocking.)
  backend-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run backend-boot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
