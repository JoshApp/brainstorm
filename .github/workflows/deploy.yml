name: Deploy to GitHub Pages

# Deploys ONLY from `main`. Session branches (claude/<task-name>) are
# work branches — agents push there freely without racing on the live
# URL. Going live = merging the session branch into main, which is what
# `npm run live` does in one step. Keep this file in sync with the
# README + the `Deploy` section of CLAUDE.md.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the patch-log generator (prebuild) can read
          # every commit. Default shallow clone (depth 1) would yield a
          # one-entry changelog.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        # Sentry source-map upload activates only when all three are set as repo
        # secrets/vars (Settings → Secrets and variables → Actions). Until then
        # the vite plugin is inert and the build is unchanged.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
